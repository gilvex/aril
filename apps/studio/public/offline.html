<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#302a3b" />
  <title>Aril · Offline</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#f1ebf5;background:#19161f;color-scheme:dark}
    body{margin:0;min-height:100dvh;display:grid;place-items:center}
    main{max-width:360px;padding:32px;text-align:center}img{width:56px;height:56px}
    h1{font-size:26px;letter-spacing:-.5px;margin:24px 0 12px}p{color:#cbc2d3;font-size:15px;line-height:1.7}
    button{font:inherit;padding:12px 22px;border:0;border-radius:9px;background:#b34568;color:white;margin-top:12px;cursor:pointer}
    button:focus-visible{outline:3px solid #f0a1be;outline-offset:4px}
  </style>
  <script src="/offline.js" defer></script>
</head>
<body><main>
  <img src="/aril.svg" alt="" />
  <h1 id="title">You're offline</h1>
  <p id="description">Reconnect to open your workspace. Your saved plans are waiting for you.</p>
  <button id="retry">Try again</button>
</main></body>
</html>
