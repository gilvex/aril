name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test scripts/signIn.browser.test.mjs scripts/firstWorkspace.browser.test.mjs scripts/networkCanvas.browser.test.mjs scripts/sharing.browser.test.mjs
      - run: pnpm verify:recovery
      - run: pnpm benchmark:collaboration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-verification
          path: artifacts/verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: aril_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aril_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://postgres:fixture-only@127.0.0.1:5432/aril_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add the unprivileged role used by the schema-isolation assertion
        env:
          PGPASSWORD: fixture-only
        run: psql -h 127.0.0.1 -U postgres -d aril_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN;'
      - name: Verify concurrent instances and access isolation
        run: pnpm --filter @aril/studio exec node --import ./scripts/registerAliases.mjs --test server/postgres.test.ts server/guestLinks.test.ts
